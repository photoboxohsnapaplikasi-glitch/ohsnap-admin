<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - OH SNAP! Photobox</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Login Admin Dashboard OH SNAP! Photobox.">
    <script>if (window.top !== window.self) { window.top.location = window.self.location; }</script>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f8;
            color: #111111;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            text-align: center;
        }
        .logo-badge {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            object-fit: contain;
            margin-bottom: 14px;
        }
        h1 { color: #111111; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
        h1 span { color: #111111; }
        p.sub { color: #71717a; font-size: 0.85rem; margin-bottom: 24px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: #27272a; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 10px 13px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #111111;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }
        .form-group input:focus { border-color: #111111; box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08); }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 44px; }
        .toggle-pw {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #71717a;
            cursor: pointer;
            padding: 0;
        }
        .toggle-pw:hover { color: #111111; background: #f4f4f5; }
        .toggle-pw svg { width: 20px; height: 20px; display: block; }
        .toggle-pw .icon-eye-off { display: none; }
        .toggle-pw.is-visible .icon-eye { display: none; }
        .toggle-pw.is-visible .icon-eye-off { display: block; }
        .turnstile-wrap {
            margin: 4px 0 14px;
            display: flex;
            justify-content: center;
            min-height: 65px;
        }
        .btn-login {
            width: 100%;
            background: #111111;
            color: #ffffff;
            border: 1px solid #111111;
            padding: 11px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .btn-login:hover { background: #27272a; }
        .btn-login:disabled { opacity: 0.6; cursor: wait; }
        .back-link { display: inline-block; margin-top: 20px; color: #52525b; text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: #111111; }
        .error-msg { color: #111111; background: #f4f4f5; border: 1px solid #18181b; padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; margin-bottom: 16px; display: none; text-align: left; }
        :focus-visible { outline: 2px solid #111111; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="images/logo-icon.jpg" alt="Logo" class="logo-badge" onerror="this.style.display='none'">
        <h1>ADMIN <span>OH SNAP!</span></h1>
        <p class="sub">Silakan masuk untuk mengelola website</p>
        <div id="errorBox" class="error-msg">Username atau Password salah!</div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" required>
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan password" aria-pressed="false" title="Tampilkan password">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <div class="turnstile-wrap">
                <div class="cf-turnstile" id="loginTurnstile" data-sitekey="0x4AAAAAAGTkwAnDGm329rR9" data-theme="light" data-callback="onLoginTurnstileSuccess" data-expired-callback="onLoginTurnstileExpired" data-error-callback="onLoginTurnstileError"></div>
            </div>
            <button type="submit" class="btn-login" id="btnLoginSubmit">Masuk ke Dashboard</button>
        </form>
        <a href="https://web.ohsnap.id" id="backToMainLink" class="back-link">← Kembali ke Halaman Utama</a>
    </div>

    <script>
        // Tombol mata: tampilkan / sembunyikan password
        (function () {
            var btn = document.getElementById('togglePw');
            var input = document.getElementById('password');
            if (!btn || !input) return;
            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.classList.toggle('is-visible', show);
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                var label = show ? 'Sembunyikan password' : 'Tampilkan password';
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', label);
                input.focus();
            });
        })();
    </script>
    <script src="cms-cloud.js"></script>
    <script>
        // Hanguskan sesi lama di server & browser setiap kali halaman login dibuka
        const prevToken = sessionStorage.getItem('ohsnap_admin_token');
        if (prevToken) { OhSnapCloud.logoutAdminSession(prevToken); }
        localStorage.removeItem('ohsnap_admin_logged');
        sessionStorage.removeItem('ohsnap_admin_logged');
        sessionStorage.removeItem('ohsnap_admin_token');
        sessionStorage.removeItem('ohsnap_admin_active');
        sessionStorage.removeItem('ohsnap_login_ticket');

        let failedCount = 0;
        let lockedUntilTs = 0;
        let turnstileToken = '';

        window.onLoginTurnstileSuccess = function (token) {
            turnstileToken = String(token || '').trim();
        };
        window.onLoginTurnstileExpired = function () {
            turnstileToken = '';
        };
        window.onLoginTurnstileError = function () {
            turnstileToken = '';
        };
        function resetTurnstile() {
            turnstileToken = '';
            try {
                if (window.turnstile && typeof window.turnstile.reset === 'function') {
                    window.turnstile.reset();
                }
            } catch (e) {}
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const btn = document.getElementById('btnLoginSubmit');
            errorBox.style.display = 'none';

            if (Date.now() < lockedUntilTs) {
                const sisa = Math.ceil((lockedUntilTs - Date.now()) / 1000);
                errorBox.textContent = 'Terlalu banyak percobaan gagal. Coba lagi dalam ' + sisa + ' detik.';
                errorBox.style.display = 'block';
                return;
            }

            const hiddenInput = document.querySelector('input[name="cf-turnstile-response"]');
            const activeToken = turnstileToken || (hiddenInput ? String(hiddenInput.value || '').trim() : '');
            if (!activeToken) {
                errorBox.textContent = 'Mohon selesaikan verifikasi keamanan Cloudflare terlebih dahulu.';
                errorBox.style.display = 'block';
                return;
            }

            btn.textContent = 'Memeriksa Akun...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: u,
                        password: p,
                        turnstileToken: activeToken
                    })
                });
                let authRes = null;
                try { authRes = await res.json(); } catch (pe) {}
                if (!res.ok && (!authRes || typeof authRes !== 'object')) {
                    const httpErr = new Error('HTTP ' + res.status);
                    httpErr.status = res.status;
                    throw httpErr;
                }

                btn.textContent = 'Masuk ke Dashboard';
                btn.disabled = false;

                if (authRes && authRes.ok && authRes.token) {
                    failedCount = 0;
                    lockedUntilTs = 0;
                    sessionStorage.setItem('ohsnap_admin_token', authRes.token);
                    sessionStorage.setItem('ohsnap_admin_logged', JSON.stringify(authRes.user || { username: u }));
                    sessionStorage.setItem('ohsnap_login_ticket', String(Date.now()));
                    if (authRes.mustChangePassword) sessionStorage.setItem('ohsnap_must_change_pw', '1');
                    else sessionStorage.removeItem('ohsnap_must_change_pw');
                    window.location.replace('admin');
                } else {
                    resetTurnstile();
                    if (!authRes || !authRes.turnstileError) {
                        failedCount++;
                        if (failedCount >= 5) {
                            lockedUntilTs = Date.now() + 30000;
                            failedCount = 0;
                        }
                        document.getElementById('password').value = '';
                    }
                    errorBox.textContent = (authRes && authRes.error) ? authRes.error : 'Username atau Password salah!';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                resetTurnstile();
                btn.textContent = 'Masuk ke Dashboard';
                btn.disabled = false;
                const hint = (err && err.status === 404)
                    ? 'Layanan login sedang dalam pemeliharaan. Hubungi administrator.'
                    : 'Gagal menghubungi server Cloud (' + (err.message || 'Cek koneksi') + ').';
                errorBox.textContent = hint;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
